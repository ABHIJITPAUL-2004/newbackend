# =============================================
# GriHom 2.0 - Backend application.properties
# =============================================

# Server
server.port=8080

# ── MySQL Database ──────────────────────────
# Replace YOUR_DB_NAME, YOUR_USERNAME, YOUR_PASSWORD with your actual credentials
spring.datasource.url=jdbc:mysql://localhost:3306/grihom_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ─────────────────────────
# "update" → creates/updates tables automatically; use "create" to reset on each start
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── Logging ─────────────────────────────────
logging.level.com.grihom=DEBUG
logging.level.org.springframework.web=INFO
